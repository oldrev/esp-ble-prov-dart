class ProvisionerError implements Exception {
  const ProvisionerError(
    this.message, {
    this.code = ProvisionerErrorCode.unknown,
    this.operation,
    this.cause,
  });

  final String message;
  final ProvisionerErrorCode code;
  final String? operation;
  final Object? cause;

  @override
  String toString() => 'ProvisionerError: $message';
}

enum ProvisionerErrorCode {
  unknown,
  connectionLost,
  endpointNotFound,
  emptyResponse,
  responseFormat,
  timeout,
  wifiConnectionFailed,
  securityFailed,
}

class ProvisioningCancellationToken {
